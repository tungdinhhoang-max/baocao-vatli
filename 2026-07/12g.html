}

  l.forEach((r,i)=>{ if(r.examScore===null||r.examScore===undefined) return;
    if(r.examScore!==prev){ h=i+1; prev=r.examScore; } m[r.name]=h; });
  return m; })();
function hangOf(n){ return _rk[n]===undefined? null : _rk[n]; }

function xepLoai(v){
  if(v===null||v===undefined) return null;
  if(v>=9)   return 'xuất sắc';
  if(v>=8.5) return 'giỏi';
  if(v>=8)   return 'tốt';
  if(v>=7)   return 'khá';
  if(v>=6.5) return 'trung bình khá';
  if(v>=5)   return 'trung bình';
  return 'cần cố gắng thêm';
}
function examCls(v){ if(v===null||v===undefined) return 'mut';
  if(v>=8) return 'good'; if(v>=6.5) return 'warn'; return 'crit'; }
function ccCls(p){ if(p===null||p===undefined) return 'mut';
  if(p>=85) return 'good'; if(p>=65) return 'warn'; return 'crit'; }
function ccTxt(r){ return (r.ccTong? r.ccCo+'/'+r.ccTong : '—'); }

function renderHead(){
  document.getElementById('clsName').textContent = 'Nhận xét tháng 7 · Lớp '+DATA.lop;
  document.getElementById('clsSub').innerHTML =
    'Môn Vật lí · '+DATA.tenGV+'<br>Tháng 7/2026 · Sĩ số '+DATA.nHS+' học sinh';
  document.title = 'Nhận Xét Tháng 7 - Vật Lí - Lớp '+DATA.lop+' - '+DATA.tenGV+(PARENT?'':' (bản thầy cô)');

  const diem = all.map(r=>r.examScore).filter(v=>v!==null&&v!==undefined);
  const gioi = diem.filter(v=>v>=8).length;
  const k = [
    {c:'brand', lbl:'Điểm TB lớp', val: DATA.tb!==null? fmt(DATA.tb):'—', sm:''},
    {c:'good',  lbl:'Đạt 8,0 trở lên', val:gioi, sm:'em'},
    {c:'warn',  lbl:'Vắng thi', val: DATA.nHS-DATA.nThi, sm:'em'},
    {c:'gold',  lbl:'Sĩ số', val: DATA.nHS, sm:'em'}
  ];
  document.getElementById('kpis').innerHTML = k.map(x=>
    `<div class="kpi ${x.c}"><div class="lbl">${x.lbl}</div><div class="val tnum">${x.val} <small>${x.sm}</small></div></div>`).join('');

  document.getElementById('detailHead').innerHTML = PARENT
    ? 'Kết quả từng học sinh <span class="hint">— bấm vào tên con để xem nhận xét chi tiết</span>'
    : 'Chi tiết học sinh <span class="hint">— bấm vào tên để xem nhận xét</span>';

  document.getElementById('dataNote').innerHTML =
    '<b>Lưu ý khi đọc bảng:</b> tháng 7 là <b>kì thi khảo sát đầu tiên</b> của lớp, nên chưa có số liệu '
    + 'tháng trước để đối chiếu. Kết quả này là mốc khởi đầu để thầy cô theo dõi sự tiến bộ của các con '
    + 'trong những tháng tới. Cột <i>Chuyên cần</i> là số buổi con có mặt trên tổng số buổi lớp đã học '
    + '(tính từ buổi con bắt đầu vào lớp).';

  const top = rankedList().filter(r=>r.examScore!==null&&r.examScore!==undefined).slice(0,3);
  const medal = ['🥇','🥈','🥉'];
  document.getElementById('hb').innerHTML = top.map((r,i)=>
    `<div class="hbcard${i===0?' gold':''}"><div class="medal">${medal[i]}</div><div class="nm">${r.name}</div>
     <div class="big tnum">${fmt(r.examScore)}</div><div class="rs">Điểm thi khảo sát tháng 7</div></div>`).join('');

  document.getElementById('foot').innerHTML =
    'Trung tâm Mapstudy Hạ Long · Môn Vật lí — Lớp '+DATA.lop+' · '+DATA.tenGV+' · Tổng hợp tháng 7/2026';
}

function renderTable(){
  const list = rankedList();
  const head = ['#','HỌ VÀ TÊN','ĐIỂM THI','XẾP LOẠI','CHUYÊN CẦN'];
  const thead = `<thead><tr>${head.map((h,i)=>`<th class="${i===1?'name':''}">${h}</th>`).join('')}</tr></thead>`;
  const body = list.map(r=>{
    const hang = hangOf(r.name);
    const co = r.examScore!==null && r.examScore!==undefined;
    const d = { name:noAccent(r.name), noexam:String(!co),
                low:String(r.ccPct!==null && r.ccPct!==undefined && r.ccPct<65) };
    const attrs = Object.entries(d).map(([k,v])=>`data-${k}="${v}"`).join(' ');
    let tds = `<td class="tnum">${hang?'<span class="rank">#</span>'+hang:'—'}</td>`
      + `<td class="name"><span class="clickname" data-open="${encodeURIComponent(r.name)}">${r.name}</span>`
      + (r.vangThi?' <span class="flag gap">vắng thi</span>':'')
      + (!PARENT && r.hoc2Lop?' <span class="flag">học 2 lớp</span>':'')
      + (!PARENT && r.nxTuMay?' <span class="flag internal-only">nx máy</span>':'')
      + `</td>`
      + `<td class="exam ${examCls(r.examScore)} tnum">${co?fmt(r.examScore):'vắng'}</td>`
      + `<td>${xepLoai(r.examScore)||'—'}</td>`
      + `<td class="exam ${ccCls(r.ccPct)} tnum">${ccTxt(r)}${r.ccPct!==null&&r.ccPct!==undefined?' <small>('+r.ccPct+'%)</small>':''}</td>`;
    return `<tr ${attrs}>${tds}</tr>`;
  }).join('');
  document.getElementById('tbl').innerHTML = thead+'<tbody>'+body+'</tbody>';
  document.querySelectorAll('.clickname').forEach(el=>
    el.addEventListener('click',()=>renderModal(decodeURIComponent(el.dataset.open))));
}

function applyFilter(){
  document.querySelectorAll('#tbl tbody tr').forEach(tr=>{
    const d=tr.dataset; let ok=true;
    if(QUERY && !d.name.includes(QUERY)) ok=false;
    if(FILTER==='noexam' && d.noexam!=='true') ok=false;
    if(FILTER==='low' && d.low!=='true') ok=false;
    tr.classList.toggle('hide',!ok);
  });
}

function renderModal(name){
  const r = all.find(x=>x.name===name); if(!r) return;
  const hang = hangOf(name);
  const flags = [];
  if(!PARENT && r.vangThi) flags.push('<span class="flag gap">vắng thi</span>');
  if(!PARENT && r.hoc2Lop) flags.push('<span class="flag">học 2 lớp</span>');
  if(!PARENT && r.nxTuMay) flags.push('<span class="flag internal-only">nhận xét do máy soạn</span>');
  if(hang!==null && hang<=3) flags.push('<span class="flag gold">🎓 Top '+hang+' lớp</span>');
  const boxes = [
    `<div class="box"><div class="n tnum">${fmt(r.examScore)}</div><div class="l">Điểm thi T7</div></div>`,
    `<div class="box"><div class="n tnum">${hang?'#'+hang:'—'}</div><div class="l">Hạng lớp</div></div>`,
    `<div class="box"><div class="n tnum">${ccTxt(r)}</div><div class="l">Chuyên cần</div></div>`
  ];
  document.getElementById('modalCard').innerHTML = `
    <div class="mhead">
      <div><div class="center-name">Trung tâm Mapstudy Hạ Long</div><h3>${r.name}</h3>
        <div style="margin-top:6px">${flags.join(' ')}</div></div>
      <div><div class="period">Môn Vật lí · Lớp ${DATA.lop}<br>${DATA.tenGV}<br>Tháng 7/2026</div>
        <button class="xbtn no-print" onclick="closeModal()">×</button></div>
    </div>
    <div class="mbody">
      <div class="mbig">${boxes.join('')}</div>
      <div class="mrow"><span class="k">Hạng trong lớp</span><span class="v">${hang?('#'+hang+' / '+DATA.nHS):'chưa xếp hạng (vắng thi)'}</span></div>
      <div class="mrow"><span class="k">Xếp loại</span><span class="v">${xepLoai(r.examScore)||'chưa có điểm thi'}</span></div>
      <div class="mrow"><span class="k">Chuyên cần tháng 7</span><span class="v">${ccTxt(r)}${r.ccPct!==null&&r.ccPct!==undefined?' ('+r.ccPct+'%)':''}</span></div>
      <div class="mcmt"><b>Nhận xét của thầy cô:</b><br>${r.nhanXet}</div>
      <div class="mbtns no-print"><button class="btn ghost" onclick="window.print()">🖨 In / Lưu PDF</button>
        <button class="btn" onclick="closeModal()">Đóng</button></div>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }

function exportExcel(){
  const head = ['#','Họ và tên','Điểm thi T7','Xếp loại','Chuyên cần','Nhận xét'];
  const body = rankedList().map(r=>{
    const c = [hangOf(r.name)||'', r.name, r.examScore===null?'vắng thi':r.examScore,
               xepLoai(r.examScore)||'', ccTxt(r), r.nhanXet];
    return '<tr>'+c.map(x=>`<td>${x}</td>`).join('')+'</tr>';
  }).join('');
  const html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table border="1"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${body}</table></body></html>`;
  const blob = new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'BangDiem_'+DATA.lop+'_T07.xls'; a.click();
}

document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

renderHead(); renderTable();
document.getElementById('q').addEventListener('input',e=>{QUERY=noAccent(e.target.value.trim());applyFilter();});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); FILTER=c.dataset.f; applyFilter();
}));
const bE=document.getElementById('btnExcel'); if(bE) bE.addEventListener('click',exportExcel);
</script>
</body>
</html>
